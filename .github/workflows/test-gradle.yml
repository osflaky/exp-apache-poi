# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  workflow_dispatch:

# one run per PR: a new commit cancels the run still in flight for the previous one;
# pushes to the protected branches are never cancelled, so every commit there gets its result
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          java: 21
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest-21-arm64
    name: Java ${{ matrix.java }} build [${{ matrix.expander_leg }}]
    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v6
      with:
        # Temurin publishes no Windows aarch64 build of JDK 17; the Microsoft Build of OpenJDK does
        distribution: ${{ (matrix.os == 'windows-latest' && matrix.arch == 
          'arm64') && 'microsoft' || 'temurin' }}
        java-version: ${{ matrix.java }}
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # SpotBugs is left to the nightly Jenkins jobs (the 'jenkins' task runs 'check' in full):
    # it cannot fail this build (ignoreFailures = true) and only adds time and memory pressure here
    - name: Build with Gradle
      run: ./gradlew check -PjdkVersion=${{ matrix.java }} -x spotbugsMain -x 
        spotbugsTest --no-daemon --refresh-dependencies
    timeout-minutes: 150
